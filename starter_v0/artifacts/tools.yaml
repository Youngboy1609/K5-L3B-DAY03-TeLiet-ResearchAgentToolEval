# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: domain_filter
    description: "Lọc danh sách các bài viết/nguồn tin đã có, chỉ giữ lại các bài thuộc các tên miền trong danh sách allowed_domains (hỗ trợ cả subdomain như news.example.com). Khi nào dùng: khi người dùng yêu cầu chỉ lấy tin từ các trang web hoặc domain cụ thể từ danh sách kết quả. Khi nào không dùng: khi tìm kiếm bài viết mới từ đầu trên web."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các item/bài viết cần lọc"
          items:
            type: object
            properties:
              url: {type: string}
              title: {type: string}
              summary: {type: string}
        allowed_domains:
          type: array
          default: []
          description: "Danh sách các tên miền cho phép (ví dụ: ['example.com', 'vinuni.edu.vn'])"
          items:
            type: string
      required: [items, allowed_domains]

  - name: source_audit
    description: "Kiểm tra tính hợp lệ về mặt kỹ thuật của danh sách nguồn tin đã thu thập (URL hợp lệ HTTP/HTTPS và metadata nguồn). Khi nào dùng: khi người dùng yêu cầu kiểm tra link, kiểm toán hoặc audit các nguồn tin thu thập được xem có lỗi link hay thiếu URL không. Khi nào không dùng: khi muốn xác minh nội dung bài viết là sự thật hay giả mạo."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các bài viết / nguồn tin cần kiểm tra"
          items:
            type: object
            properties:
              url: {type: string}
              title: {type: string}
              source: {type: string}
      required: [items]

  - name: deduplicate_sources
    description: "Loại bỏ các bài viết/nguồn tin bị trùng lặp URL trong danh sách items đã thu thập, giữ lại item đầu tiên. Khi nào dùng: khi kết quả tìm kiếm từ nhiều nguồn hoặc nhiều lượt có các bài viết bị trùng lặp URL và người dùng yêu cầu loại bỏ bài trùng. Khi nào không dùng: khi tìm kiếm bài viết mới từ đầu."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các bài viết cần loại bỏ trùng lặp"
          items:
            type: object
            properties:
              url: {type: string}
              title: {type: string}
              summary: {type: string}
        keep_no_url:
          type: boolean
          default: true
          description: "Có giữ lại các item không có URL hay không"
      required: [items]

  - name: rank_sources
    description: "Sắp xếp lại danh sách các bài viết đã thu thập theo mức độ trùng khớp từ khóa với câu truy vấn query (heuristic lexical overlap). Khi nào dùng: khi người dùng yêu cầu sắp xếp các bài viết đã tìm thấy theo độ liên quan tới một từ khóa hoặc chủ đề cụ thể, hoặc lấy top bài liên quan nhất. Khi nào không dùng: khi tìm kiếm bài mới trên internet."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các bài viết cần sắp xếp"
          items:
            type: object
            properties:
              url: {type: string}
              title: {type: string}
              summary: {type: string}
        query:
          type: string
          default: ""
          description: "Từ khóa hoặc câu truy vấn để tính điểm trùng lặp"
        limit:
          type: integer
          default: 5
          description: "Số lượng bài viết tối đa cần giữ lại sau khi sắp xếp"
      required: [items, query]
